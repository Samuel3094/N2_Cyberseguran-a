# Ambiente completo: MongoDB + API + Frontend, com políticas de segurança nos contêineres.
# Uso: copie .env.example para .env, ajuste os segredos e rode `docker compose up --build`.
# Para usar MongoDB Atlas (nuvem), defina MONGODB_URI no .env e remova o serviço "mongo".

x-security: &security
  security_opt:
    - no-new-privileges:true # impede escalonamento de privilégios (setuid)
  cap_drop:
    - ALL # remove todas as capabilities do kernel
  read_only: true # sistema de arquivos somente leitura
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

services:
  mongo:
    image: mongo:7
    <<: *security
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE] # mínimo exigido pelo entrypoint do mongo
    read_only: false
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks: [db-net] # rede interna: o banco NÃO é exposto ao host
    mem_limit: 512m
    pids_limit: 200
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    <<: *security
    env_file: .env
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:-mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/assinaturas?authSource=admin}
    user: node
    tmpfs: [/tmp]
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '127.0.0.1:4000:4000' # publicado apenas no loopback; use um proxy HTTPS na frente
    networks: [db-net, web-net]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    <<: *security
    tmpfs: [/tmp]
    depends_on: [backend]
    ports:
      - '127.0.0.1:8080:8080'
    networks: [web-net]
    mem_limit: 64m
    pids_limit: 50

networks:
  db-net:
    internal: true
  web-net:

volumes:
  mongo-data:
